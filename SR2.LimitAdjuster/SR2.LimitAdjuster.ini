; Comments/explanations for each option are collected at the bottom of this file.

[MAIN]
ForceEvenIfBelow=0

[LIMITS]
CustomizationItems=auto
Items3D=220
CustomizationLogos=auto
Unlockables=500
WeaponStoreBucketLimit=32

[SAVES]
UnlockablesExt=1
WeaponInfosExt=1

[AUDIO]
WavebankBytes=0
SoundbankBytes=0

[HAVOK]
ExtraMemoryMB=32

[VINT]
Bitmaps=2048
Groups=768
Texts=768
BitmapCircles=192

[EXPERIMENTAL]
DynamicMempools=1
DynamicStringMempools=1


; =========================
; Comments / Explanations
; =========================

; [MAIN]
; ForceEvenIfBelow
; 1 = always apply the dynamic patches even if the detected XTBL count
; is still at or below the vanilla game limit.
; 0 = only patch when the detected count exceeds vanilla.

; [LIMITS]
; General rules for count limits:
; - auto = use the detected XTBL count when needed
; - number = force a fixed capacity
; - 0 or -1 = disable patching for that limit
; Numeric values are clamped up to the vanilla minimum if set too low.
; Numeric values are used as-is, so make sure they cover what the XTBL needs.

; CustomizationItems
; customization_items.xtbl
; Vanilla minimum: 1050

; Items3D
; items_3d.xtbl
; Vanilla minimum: 220
; Might still be unstable in some cases.

; CustomizationLogos
; customization_logos.xtbl
; Vanilla minimum: 384

; Unlockables
; unlockables.xtbl
; Vanilla minimum: 150
; Max runtime unlockables table capacity.
; This affects the in-memory limit only, not save format by itself.

; WeaponStoreBucketLimit
; Max weapons per weapon-store/cache category bucket.
; Vanilla is 16.
; Raise this if weapons start bleeding into other categories in stores/cache.
; This one is manual-only and is rounded up to a power of two if needed.

; [SAVES]
; UnlockablesExt
; 1 = use checksum-based extended save/load for unlockables
; 0 = keep vanilla/index-based unlockables save/load

; WeaponInfosExt
; 1 = use checksum-based extended save/load for crib weapon availability
; 0 = keep vanilla crib weapon save/load

; [AUDIO]
; WavebankBytes
; Audio wavebank pool size in bytes.
; 0 = vanilla (98 MiB). Max 512 MiB.

; SoundbankBytes
; Audio soundbank pool size in bytes.
; 0 = vanilla (1.375 MiB). Max 64 MiB.

; [HAVOK]
; ExtraMemoryMB
; Extra memory Havok can use once its vanilla 8 MB is full.
; 0 = vanilla only. Max 512.

; [VINT]
; UI object pool sizes.
; Raise these if UI elements start disappearing.
; Vanilla: Bitmaps 864, Groups 331, Texts 344, BitmapCircles 64. Max 16384.

; [EXPERIMENTAL]
; DynamicMempools
; Tries to make some game memory pools grow instead of running out of space.
; Also extends the cutscene memory pool.
; Experimental and may be unstable.

; DynamicStringMempools
; Dynamically expands string_pool requests.
; Kind of hacky, but should generally be fine.
